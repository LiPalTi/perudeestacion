spring.application.name=perudeestacion

# Lee las credenciales del archivo .env en la raiz del proyecto (no se sube a GitHub).
spring.config.import=optional:file:.env[.properties]

# --- Base de datos: PostgreSQL en Supabase (Session pooler, puerto 5432) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Plan gratuito de Supabase: pocas conexiones, un pool pequeno es suficiente.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
# Las tablas se crean con los scripts de src/main/resources/db en el SQL Editor de Supabase.
# "validate" solo comprueba que las entidades coincidan con las tablas; no modifica la base.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Seguridad ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

server.port=8080
