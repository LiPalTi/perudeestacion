spring.application.name=perudeestacion

# Lee las credenciales del archivo .env en la raiz del proyecto (no se sube a GitHub).
# Tambien acepta .env.txt, el nombre que a veces deja el Bloc de notas de Windows.
spring.config.import=optional:file:.env[.properties],optional:file:.env.txt[.properties]

# --- Base de datos: PostgreSQL en Supabase (Session pooler, puerto 5432) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Plan gratuito de Supabase: pocas conexiones, un pool pequeno es suficiente.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
# El pooler cierra conexiones inactivas: Hikari las comprueba y renueva antes de que caduquen.
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=600000
# Si la base no responde al arrancar (proyecto pausado), la app inicia igual y responde 503 hasta que vuelva.
spring.datasource.hikari.initialization-fail-timeout=-1

# Crea las tablas y carga los datos de prueba si la base esta vacia (db/01 y db/02).
app.db.auto-init=${DB_AUTO_INIT:true}

# --- JPA / Hibernate ---
# El esquema lo controlan los scripts SQL, no Hibernate. Con DDL_AUTO=validate se comprueba
# que las entidades coincidan con las tablas (la integracion continua lo hace en cada cambio).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Seguridad ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

server.port=${PORT:8080}
