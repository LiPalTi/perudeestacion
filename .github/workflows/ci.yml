# Integracion continua (gratis en repositorios publicos de GitHub).
# En cada cambio: compila, ejecuta la prueba unitaria, levanta la API contra un PostgreSQL limpio
# (la app crea las tablas y carga los datos de prueba), valida las entidades contra las tablas
# y ejecuta la coleccion de Postman con Newman. Los registros y resultados quedan como artefacto.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: clave-de-integracion-continua-con-mas-de-32-caracteres
      ADMIN_EMAIL: admin@perudeestacion.pe
      ADMIN_PASSWORD: ClaveDePrueba2026
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas unitarias
        run: ./mvnw -B -ntp verify

      - name: Primer arranque (crea tablas y carga datos de prueba)
        run: |
          java -jar target/perudeestacion-*.jar > arranque-1.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v1/departamentos > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/api/v1/departamentos > /dev/null
          kill "$(cat app.pid)" && sleep 5

      - name: Verificar los datos de prueba cargados
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -At -F ' ' -c "
            SELECT 'departamento', count(*) FROM departamento UNION ALL
            SELECT 'temporada', count(*) FROM temporada UNION ALL
            SELECT 'simulacion', count(*) FROM simulacion UNION ALL
            SELECT 'usuario_admin', count(*) FROM usuario_admin" | tee conteos.txt
          grep -qx "departamento 25" conteos.txt
          grep -qx "temporada 360" conteos.txt
          grep -qx "simulacion 8" conteos.txt
          grep -qx "usuario_admin 1" conteos.txt

      - name: Segundo arranque validando entidades contra las tablas
        env:
          DDL_AUTO: validate
        run: |
          java -jar target/perudeestacion-*.jar > arranque-2.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v1/departamentos > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/api/v1/departamentos > /dev/null

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Pruebas de endpoints con la coleccion de Postman (Newman)
        run: |
          npx --yes newman@6 run docs/postman/PeruDeEstacion.postman_collection.json \
            --env-var "adminPassword=${ADMIN_PASSWORD}" \
            --reporters cli,junit --reporter-junit-export resultados/newman.xml

      - name: Arranque con la base de datos caida (debe responder 503, no caerse)
        env:
          DB_URL: jdbc:postgresql://localhost:5999/postgres
          PORT: "8081"
        run: |
          java -jar target/perudeestacion-*.jar > arranque-3.log 2>&1 &
          code=000
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 http://localhost:8081/api/v1/departamentos || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "Codigo HTTP con la base caida: $code"
          test "$code" = "503"

      - name: Resumen de los arranques
        if: always()
        run: |
          for f in arranque-*.log; do
            echo "== $f"
            grep -E "WARN|ERROR|Base de datos|ejecutando|Administrador|Started|Exception" "$f" || true
          done

      - name: Guardar registros y resultados
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resultados-pruebas
          path: |
            arranque-*.log
            resultados/
